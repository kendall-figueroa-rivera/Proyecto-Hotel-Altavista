<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/><title>Reservaciones | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('reservaciones')}"></div>
    <div class="main-content">
        <header class="topbar"><h1 class="page-title">Reservaciones</h1></header>
        <main class="page-body">
            <div th:if="${exito}" class="alert alert-success"><i class="fas fa-check-circle"></i><span th:text="${exito}"></span></div>
            <div th:if="${error}" class="alert alert-danger"><i class="fas fa-exclamation-circle"></i><span th:text="${error}"></span></div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Todas las Reservaciones</span>
                    <a th:href="@{/reservaciones/nueva}" class="btn btn-primary btn-sm"
                       sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')">
                        <i class="fas fa-plus"></i> Nueva
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Huésped</th>
                            <th>Habitación</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="res : ${reservaciones}">
                            <td th:text="${res.idReservacion}"></td>
                            <td th:text="${res.usuario.nombre + ' ' + res.usuario.apellido1}"></td>
                            <td th:text="'#' + ${res.habitacion.numero} + ' — ' + ${res.habitacion.tipo}"></td>
                            <td th:text="${res.fechaEntrada}"></td>
                            <td th:text="${res.fechaSalida}"></td>
                            <td th:text="'₡ ' + ${#numbers.formatDecimal(res.totalPago,1,2)}"></td>
                            <td>
                                <span th:class="'badge badge-' +
                                    (${res.estado == 'confirmada'} ? 'success' :
                                    (${res.estado == 'pagada'}     ? 'gold' :
                                    (${res.estado == 'cancelada'}  ? 'danger' :
                                    (${res.estado == 'reservada'}  ? 'info' : 'warning'))))"
                                      th:text="${res.estado}"></span>
                            </td>
                            <td>
                                <a th:href="@{/reservaciones/detalle/{id}(id=${res.idReservacion})}"
                                   class="btn btn-outline btn-sm" title="Ver detalle">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{/pagos/nuevo}" class="btn btn-primary btn-sm"
                                   th:if="${res.estado == 'confirmada' or res.estado == 'reservada'}"
                                   sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')"
                                   title="Procesar pago">
                                    <i class="fas fa-credit-card"></i>
                                </a>
                                <a th:href="@{/reservaciones/cancelar/{id}(id=${res.idReservacion})}"
                                   class="btn btn-danger btn-sm"
                                   th:if="${res.estado != 'cancelada' and res.estado != 'pagada'}"
                                   sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')"
                                   onclick="return confirm('¿Cancelar esta reservación?')"
                                   title="Cancelar">
                                    <i class="fas fa-times"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reservaciones)}">
                            <td colspan="8" style="text-align:center;color:var(--text-muted);padding:32px;">
                                No hay reservaciones registradas.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
