<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head>
    <meta charset="UTF-8"/>
    <title>Generar Cargo Extra | Hotel Altavista</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments :: sidebar('reservaciones')}"></div>

    <div class="main-content">

        <header class="topbar">
            <h1 class="page-title">Generar Cargo Extra</h1>
        </header>

        <main class="page-body">

            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${exito}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${exito}"></span>
            </div>

            <div class="card">

                <div class="card-header">
                    <span class="card-title">Información de la Reservación</span>
                </div>

                <div class="card-body">

                    <p>
                        <strong>Reservación:</strong>
                        <span th:text="${reservacion.idReservacion}"></span>
                    </p>

                    <p>
                        <strong>Cliente:</strong>
                        <span th:text="${reservacion.usuario.nombre}"></span>
                    </p>

                    <p>
                        <strong>Habitación:</strong>
                        <span th:text="${reservacion.habitacion.numero}"></span>
                    </p>

                    <p>
                        <strong>Estado:</strong>
                        <span th:text="${reservacion.estado}"></span>
                    </p>

                    <hr>

                    <form th:action="@{/cargos-extra/guardar}" method="post">

                        <input type="hidden"
                               name="idReservacion"
                               th:value="${reservacion.idReservacion}"/>

                        <div class="form-group">

                            <label class="form-label">
                                Descripción
                            </label>

                            <input type="text"
                                   name="descripcion"
                                   class="form-control"
                                   maxlength="255"
                                   required>

                        </div>

                        <div class="form-group">

                            <label class="form-label">
                                Monto
                            </label>

                            <input type="number"
                                   name="monto"
                                   class="form-control"
                                   min="0.01"
                                   step="0.01"
                                   required>

                        </div>

                        <div style="display:flex; gap:12px; margin-top:25px;">

                            <a th:href="@{/reservaciones/detalle/{id}(id=${reservacion.idReservacion})}"
                               class="btn btn-secondary">

                                Cancelar

                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="fas fa-plus-circle"></i>
                                Registrar Cargo

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </div>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
