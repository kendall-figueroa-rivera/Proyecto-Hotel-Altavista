<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Habitaciones | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <!-- Sidebar igual al dashboard -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">⬡</span>
            <div class="brand-text">
                <span class="brand-name">Hotel</span>
                <span class="brand-sub">Lenguaje</span>
            </div>
        </div>
        <ul class="nav-list">
            <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li class="nav-section">GESTIÓN</li>
            <li class="nav-item"><a th:href="@{/reservaciones}" class="nav-link"><i class="fas fa-calendar-check"></i><span>Reservaciones</span></a></li>
            <li class="nav-item"><a th:href="@{/habitaciones}" class="nav-link active"><i class="fas fa-bed"></i><span>Habitaciones</span></a></li>
            <li class="nav-item"><a th:href="@{/pagos}" class="nav-link"><i class="fas fa-credit-card"></i><span>Pagos</span></a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a th:href="@{/usuarios}" class="nav-link"><i class="fas fa-users"></i><span>Usuarios</span></a></li>
            <li class="nav-section">INVENTARIO</li>
            <li class="nav-item"><a th:href="@{/productos}" class="nav-link"><i class="fas fa-box"></i><span>Productos</span></a></li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')">
                <a th:href="@{/ofertas}" class="nav-link">
                    <i class="fas fa-tag"></i>
                    <span>Ofertas</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-details">
                    <span class="user-name" sec:authentication="name">Usuario</span>
                </div>
            </div>
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">Habitaciones</h1>
        </header>

        <main class="page-body">

            <!-- Alertas -->
            <div th:if="${exito}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${exito}"></span>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Listado de Habitaciones</span>
                    <a th:href="@{/habitaciones/nueva}" class="btn btn-primary btn-sm"
                       sec:authorize="hasRole('ADMIN')">
                        <i class="fas fa-plus"></i> Nueva
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Número</th>
                            <th>Tipo</th>
                            <th>Precio / Noche</th>
                            <th>Estado</th>
                            <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="hab, i : ${habitaciones}">
                            <td th:text="${i.count}"></td>
                            <td th:text="${hab.numero}"></td>
                            <td th:text="${hab.tipo}"></td>
                            <td th:text="'₡ ' + ${#numbers.formatDecimal(hab.precioNoche, 1, 2)}"></td>
                            <td>
                                <span th:class="'badge badge-' + (${hab.estado == 'disponible'} ? 'success' : (${hab.estado == 'ocupada'} ? 'danger' : 'warning'))"
                                      th:text="${hab.estado}"></span>
                            </td>
                            <td sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/habitaciones/editar/{id}(id=${hab.idHabitacion})}"
                                   class="btn btn-outline btn-sm">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/habitaciones/eliminar/{id}(id=${hab.idHabitacion})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Eliminar esta habitación?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(habitaciones)}">
                            <td colspan="6" style="text-align:center; color:var(--text-muted); padding:32px;">
                                No hay habitaciones registradas.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
