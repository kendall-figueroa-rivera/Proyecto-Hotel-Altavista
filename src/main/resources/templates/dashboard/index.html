<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/><title>Dashboard | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('dashboard')}"></div>
    <div class="main-content">
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">Dashboard</h1>
            <div class="topbar-actions"><span class="date-display" id="currentDate"></span></div>
        </header>
        <main class="page-body">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-bed"></i></div>
                    <div class="stat-value" th:text="${totalHabitaciones}">0</div>
                    <div class="stat-label">Total Habitaciones</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="color:var(--success)"><i class="fas fa-door-open"></i></div>
                    <div class="stat-value" th:text="${habitacionesDisp}">0</div>
                    <div class="stat-label">Disponibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="color:var(--danger)"><i class="fas fa-door-closed"></i></div>
                    <div class="stat-value" th:text="${habitacionesOcupadas}">0</div>
                    <div class="stat-label">Ocupadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="color:var(--gold)"><i class="fas fa-calendar-check"></i></div>
                    <div class="stat-value" th:text="${reservacionesActivas}">0</div>
                    <div class="stat-label">Reservaciones Activas</div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                    <div class="stat-value" th:text="${totalUsuarios}">0</div>
                    <div class="stat-label">Usuarios Registrados</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-credit-card"></i></div>
                    <div class="stat-value" th:text="${totalPagos}">0</div>
                    <div class="stat-label">Pagos Procesados</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-box"></i></div>
                    <div class="stat-value" th:text="${totalProductos}">0</div>
                    <div class="stat-label">Productos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-calendar-alt"></i></div>
                    <div class="stat-value" th:text="${totalReservaciones}">0</div>
                    <div class="stat-label">Total Reservaciones</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title">Acciones Rápidas</span></div>
                <div class="card-body">
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <a th:href="@{/reservaciones/nueva}" class="btn btn-primary"><i class="fas fa-plus"></i> Nueva Reservación</a>
                        <a th:href="@{/pagos/nuevo}" class="btn btn-outline"><i class="fas fa-credit-card"></i> Procesar Pago</a>
                        <a th:href="@{/habitaciones}" class="btn btn-outline"><i class="fas fa-bed"></i> Ver Habitaciones</a>
                        <a th:href="@{/productos}" class="btn btn-outline"><i class="fas fa-box"></i> Inventario</a>
                        <a th:href="@{/usuarios}" class="btn btn-outline" sec:authorize="hasRole('ADMIN')"><i class="fas fa-users"></i> Gestionar Usuarios</a>
                        <a th:href="@{/ofertas}" class="btn btn-outline"><i class="fas fa-tag"></i> Ver Ofertas</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
