<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/><title>Oferta | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('ofertas')}"></div>
    <div class="main-content">
        <header class="topbar">
            <h1 class="page-title" th:text="${oferta.idOferta != null} ? 'Editar Oferta' : 'Nueva Oferta'"></h1>
        </header>
        <main class="page-body">
            <div class="card" style="max-width:560px;">
                <div class="card-header"><span class="card-title">Datos de la Oferta</span></div>
                <div class="card-body">
                    <form th:action="@{/ofertas/guardar}" method="post" th:object="${oferta}">
                        <input type="hidden" th:field="*{idOferta}"/>
                        <div class="form-group">
                            <label class="form-label">Título</label>
                            <input type="text" th:field="*{titulo}" class="form-control" required/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Descripción</label>
                            <input type="text" th:field="*{descripcion}" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Descuento (%)</label>
                            <input type="number" step="0.01" min="0" max="100" th:field="*{descuento}" class="form-control" required/>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Fecha Inicio</label>
                                <input type="date" th:field="*{fechaInicio}" class="form-control" required/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Fecha Fin</label>
                                <input type="date" th:field="*{fechaFin}" class="form-control" required/>
                            </div>
                        </div>
                        <div style="display:flex;gap:12px;margin-top:8px;">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                            <a th:href="@{/ofertas}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
