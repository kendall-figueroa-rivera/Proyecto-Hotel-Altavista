<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/><title>Ofertas | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('ofertas')}"></div>
    <div class="main-content">
        <header class="topbar"><h1 class="page-title">Ofertas</h1></header>
        <main class="page-body">
            <div th:if="${exito}" class="alert alert-success"><i class="fas fa-check-circle"></i><span th:text="${exito}"></span></div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Listado de Ofertas</span>
                    <a th:href="@{/ofertas/nueva}" class="btn btn-primary btn-sm" sec:authorize="hasRole('ADMIN')"><i class="fas fa-plus"></i> Nueva</a>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>ID</th><th>Título</th><th>Descuento</th><th>Inicio</th><th>Fin</th><th>Estado</th><th sec:authorize="hasRole('ADMIN')">Acciones</th></tr></thead>
                        <tbody>
                        <tr th:each="o : ${ofertas}">
                            <td th:text="${o.idOferta}"></td>
                            <td th:text="${o.titulo}"></td>
                            <td><span class="badge badge-gold" th:text="${o.descuento} + '%'"></span></td>
                            <td th:text="${o.fechaInicio}"></td>
                            <td th:text="${o.fechaFin}"></td>
                            <td>
                                <span th:if="${o.fechaFin >= #temporals.createToday()}" class="badge badge-success">Vigente</span>
                                <span th:unless="${o.fechaFin >= #temporals.createToday()}" class="badge badge-danger">Vencida</span>
                            </td>
                            <td sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/ofertas/editar/{id}(id=${o.idOferta})}" class="btn btn-outline btn-sm"><i class="fas fa-edit"></i></a>
                                <a th:href="@{/ofertas/eliminar/{id}(id=${o.idOferta})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ofertas)}"><td colspan="7" style="text-align:center;color:var(--text-muted);padding:32px;">No hay ofertas registradas.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
