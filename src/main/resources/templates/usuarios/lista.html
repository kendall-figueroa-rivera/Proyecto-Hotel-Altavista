<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/><title>Usuarios | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('usuarios')}"></div>
    <div class="main-content">
        <header class="topbar"><h1 class="page-title">Usuarios</h1></header>
        <main class="page-body">
            <div th:if="${exito}" class="alert alert-success"><i class="fas fa-check-circle"></i><span th:text="${exito}"></span></div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Gestión de Usuarios</span>
                    <a th:href="@{/registro}" class="btn btn-primary btn-sm"><i class="fas fa-user-plus"></i> Nuevo Usuario</a>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>ID</th><th>Nombre</th><th>Usuario</th><th>Correo</th><th>Rol</th><th>Registro</th><th>Acciones</th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.idUsuario}"></td>
                            <td th:text="${u.nombre + ' ' + u.apellido1}"></td>
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.correo}"></td>
                            <td>
                                <span th:if="${u.rol != null}" th:class="'badge badge-' + (${u.rol.nombre=='ADMIN'}?'gold':(${u.rol.nombre=='RECEPCIONISTA'}?'info':'success'))"
                                      th:text="${u.rol.nombre}"></span>
                                <span th:unless="${u.rol != null}" class="badge badge-warning">Sin rol</span>
                            </td>
                            <td th:text="${u.fechaRegistro}"></td>
                            <td>
                                <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-outline btn-sm"><i class="fas fa-edit"></i></a>
                                <a th:href="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}" class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Eliminar este usuario?')"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="7" style="text-align:center;color:var(--text-muted);padding:32px;">No hay usuarios registrados.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
