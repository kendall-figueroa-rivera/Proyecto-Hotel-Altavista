<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/><title>Reporte Reservaciones por Usuario | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('reportes-reservaciones')}"></div>
    <div class="main-content">
        <header class="topbar"><h1 class="page-title">Reporte de Reservaciones por Usuario</h1></header>
        <main class="page-body">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Reservaciones y Pagos por Huésped</span>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Huésped</th>
                            <th>Total Reservaciones</th>
                            <th>Total Pagado</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${reporte}">
                            <td th:text="${r.huesped}"></td>
                            <td th:text="${r.totalReservaciones}"></td>
                            <td th:text="'₡ ' + ${#numbers.formatDecimal(r.totalPagado,1,2)}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reporte)}">
                            <td colspan="3" style="text-align:center;color:var(--text-muted);padding:32px;">No hay datos todavía.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
