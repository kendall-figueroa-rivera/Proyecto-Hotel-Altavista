<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/><title>Reservaciones Activas | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('reportes-reservaciones-activas')}"></div>
    <div class="main-content">
        <header class="topbar"><h1 class="page-title">Reservaciones Activas</h1></header>
        <main class="page-body">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Vista: Reservaciones Activas</span>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Huésped</th>
                            <th>Identificación</th>
                            <th>Habitación</th>
                            <th>Tipo</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Noches</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Oferta</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${reservacionesActivas}">
                            <td th:text="${r.huesped}"></td>
                            <td th:text="${r.identificacion}"></td>
                            <td th:text="${r.habitacion}"></td>
                            <td th:text="${r.tipoHabitacion}"></td>
                            <td th:text="${r.fechaEntrada}"></td>
                            <td th:text="${r.fechaSalida}"></td>
                            <td th:text="${r.noches}"></td>
                            <td th:text="'₡ ' + ${#numbers.formatDecimal(r.totalPago,1,2)}"></td>
                            <td><span class="badge badge-success" th:text="${r.estado}"></span></td>
                            <td th:text="${r.ofertaAplicada}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reservacionesActivas)}">
                            <td colspan="10" style="text-align:center;color:var(--text-muted);padding:32px;">No hay reservaciones activas.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
