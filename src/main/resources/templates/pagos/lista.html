<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/><title>Pagos | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('pagos')}"></div>
    <div class="main-content">
        <header class="topbar"><h1 class="page-title">Pagos</h1></header>
        <main class="page-body">
            <div th:if="${exito}" class="alert alert-success"><i class="fas fa-check-circle"></i><span th:text="${exito}"></span></div>
            <div th:if="${error}" class="alert alert-danger"><i class="fas fa-exclamation-circle"></i><span th:text="${error}"></span></div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Historial de Pagos</span>
                    <a th:href="@{/pagos/nuevo}" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Nuevo Pago</a>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>ID</th><th>Reservación</th><th>Monto</th><th>Método</th><th>Fecha</th><th>Estado</th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${pagos}">
                            <td th:text="${p.idPago}"></td>
                            <td th:text="'#' + ${p.reservacion.idReservacion}"></td>
                            <td th:text="'₡ ' + ${#numbers.formatDecimal(p.monto,1,2)}"></td>
                            <td th:text="${p.metodoPago.nombre}"></td>
                            <td th:text="${#temporals.format(p.fechaPago,'dd/MM/yyyy HH:mm')}"></td>
                            <td><span th:class="'badge badge-'+(${p.estado=='completado'}?'success':(${p.estado=='reembolsado'}?'warning':'danger'))" th:text="${p.estado}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pagos)}"><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px;">No hay pagos registrados.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
