<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Registro | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="login-page">
    <div class="login-box" style="max-width:520px;">
        <div class="login-logo">
            <span class="brand-icon">⬡</span>
            <span class="brand-name">Hotel Altavista</span>
            <span class="brand-sub">Crear Cuenta</span>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>
        <div th:if="${exito}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${exito}"></span>
        </div>

        <!-- IMPORTANTE: action con th:action y method POST -->
        <form th:action="@{/registro}" method="post">

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Primer Apellido</label>
                    <input type="text" name="apellido1" class="form-control" required/>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Segundo Apellido</label>
                    <input type="text" name="apellido2" class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Identificación</label>
                    <input type="text" name="identificacion" class="form-control" required/>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Correo</label>
                    <input type="email" name="correo" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control"/>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="contrasena" class="form-control" required/>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Rol</label>
                <select name="idRol" class="form-control">
                    <option value="">Sin rol</option>
                    <option th:each="r : ${roles}"
                            th:value="${r.idRol}"
                            th:text="${r.nombre}"></option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                <i class="fas fa-user-plus"></i> Registrarse
            </button>
        </form>

        <p style="text-align:center; margin-top:20px; color:var(--text-muted); font-size:13px;">
            ¿Ya tenés cuenta?
            <a th:href="@{/login}" style="color:var(--gold); text-decoration:none;">Iniciar sesión</a>
        </p>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
