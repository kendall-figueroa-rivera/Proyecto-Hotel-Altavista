<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Productos | Hotel Altavista</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments :: sidebar('productos')}"></div>

    <div class="main-content">

        <header class="topbar">
            <h1 class="page-title">Productos</h1>
        </header>

        <main class="page-body">

            <div th:if="${exito}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${exito}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <div class="card">

                <div class="card-header">

                    <span class="card-title">
                        Inventario de Productos
                    </span>

                    <a th:href="@{/productos/nuevo}"
                       class="btn btn-primary btn-sm"
                       sec:authorize="hasRole('ADMIN')">

                        <i class="fas fa-plus"></i>
                        Nuevo

                    </a>

                </div>

                <div class="table-responsive">

                    <table class="table">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="p : ${productos}">

                            <td th:text="${p.idProducto}"></td>

                            <td th:text="${p.nombre}"></td>

                            <td th:text="${p.descripcion}"></td>

                            <td th:text="'₡ ' + ${#numbers.formatDecimal(p.precio,1,2)}"></td>

                            <td>

                                <span
                                        th:class="'badge badge-' + (${p.stock > 10} ? 'success' : (${p.stock > 0} ? 'warning' : 'danger'))"
                                        th:text="${p.stock}">
                                </span>

                            </td>

                            <td>

                                <a th:href="@{/productos/vender/{id}(id=${p.idProducto})}"
                                   class="btn btn-primary btn-sm"
                                   th:if="${p.stock > 0}">

                                    <i class="fas fa-shopping-cart"></i>
                                    Vender

                                </a>

                                <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}"
                                   class="btn btn-outline btn-sm"
                                   sec:authorize="hasRole('ADMIN')">

                                    <i class="fas fa-edit"></i>

                                </a>

                                <a th:href="@{/productos/stock/{id}(id=${p.idProducto})}"
                                   class="btn btn-outline btn-sm"
                                   sec:authorize="hasRole('ADMIN')"
                                   title="Actualizar Stock">

                                    <i class="fas fa-boxes-stacked"></i>

                                </a>

                                <a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}"
                                   class="btn btn-danger btn-sm"
                                   sec:authorize="hasRole('ADMIN')"
                                   onclick="return confirm('¿Eliminar este producto?')">

                                    <i class="fas fa-trash"></i>

                                </a>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(productos)}">

                            <td colspan="6"
                                style="text-align:center;color:var(--text-muted);padding:32px;">

                                No hay productos registrados.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
