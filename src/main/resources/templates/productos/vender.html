<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/><title>Vender | Hotel Altavista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('productos')}"></div>
    <div class="main-content">
        <header class="topbar"><h1 class="page-title">Registrar Venta</h1></header>
        <main class="page-body">
            <div style="display:grid; grid-template-columns:1fr 320px; gap:24px;">

                <!-- FORMULARIO -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title" th:text="${producto.nombre}">Producto</span>
                        <span class="badge badge-success" th:text="'Stock: ' + ${producto.stock}"></span>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/productos/vender}" method="post" id="formVenta">
                            <input type="hidden" name="idProducto" th:value="${producto.idProducto}"/>

                            <div class="form-group">
                                <label class="form-label">Vender a (Huésped / Usuario)</label>
                                <select name="idUsuario" class="form-control" required>
                                    <option value="">Seleccionar cliente...</option>
                                    <option th:each="u : ${usuarios}"
                                            th:value="${u.idUsuario}"
                                            th:text="${u.nombre + ' ' + u.apellido1 + ' — ' + u.identificacion}"></option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Cantidad</label>
                                <input type="number" name="cantidad" id="cantidad"
                                       class="form-control"
                                       min="1" th:max="${producto.stock}"
                                       value="1" required
                                       onchange="calcularSubtotal()"/>
                            </div>

                            <div style="display:flex;gap:12px;margin-top:8px;">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-shopping-cart"></i> Confirmar Venta
                                </button>
                                <a th:href="@{/productos}" class="btn btn-outline">
                                    <i class="fas fa-arrow-left"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- RESUMEN -->
                <div class="card" style="position:sticky; top:80px; height:fit-content;">
                    <div class="card-header"><span class="card-title">Resumen</span></div>
                    <div class="card-body">
                        <div style="margin-bottom:16px;">
                            <div style="color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px;">Producto</div>
                            <div style="color:var(--text-primary);" th:text="${producto.nombre}"></div>
                        </div>
                        <div style="margin-bottom:16px;">
                            <div style="color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px;">Precio unitario</div>
                            <div style="color:var(--text-primary);" th:text="'₡ ' + ${#numbers.formatDecimal(producto.precio,1,0)}"
                                 th:data-precio="${producto.precio}" id="precioUnitario"></div>
                        </div>
                        <div style="margin-bottom:16px;">
                            <div style="color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px;">Cantidad</div>
                            <div style="color:var(--text-primary);" id="resumenCantidad">1</div>
                        </div>
                        <div style="border-top:1px solid var(--border); padding-top:16px;">
                            <div style="color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;">SUBTOTAL</div>
                            <div style="color:var(--gold); font-size:28px; font-family:var(--font-display); font-weight:300;" id="resumenSubtotal">
                                ₡ <span th:text="${#numbers.formatDecimal(producto.precio,1,0)}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script>
function calcularSubtotal() {
    const cantidad = parseInt(document.getElementById('cantidad').value) || 1;
    const precio   = parseFloat(document.getElementById('precioUnitario').dataset.precio) || 0;
    const subtotal = cantidad * precio;
    document.getElementById('resumenCantidad').textContent = cantidad;
    document.getElementById('resumenSubtotal').textContent = '₡ ' + subtotal.toLocaleString('es-CR');
}
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
