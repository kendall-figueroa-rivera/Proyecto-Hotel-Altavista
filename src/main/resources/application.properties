# =============================================
# CONFIGURACION DEL SERVIDOR
# =============================================
server.port=8080
spring.application.name=hotel-altavista-sistema

# =============================================
# CONEXION A ORACLE CLOUD ATP - WALLET
# Usuario de conexion de la app: hotel_sc503_app
# (NO usar ADMIN para la app; ADMIN es solo para administracion)
#
# Las credenciales NO se escriben aqui: se leen de variables de entorno
# para no subir contrasenas a GitHub. Antes de correr la app, definir:
#   DB_TNS_ALIAS   -> alias del wallet (Wallet_BDAdmin): bdadmin_high / bdadmin_medium / bdadmin_low
#   DB_USER        -> admin_hotel_app
#   DB_PASSWORD    -> la clave que le pusieron a admin_hotel_app
#   TNS_ADMIN_PATH -> carpeta del wallet YA DESCOMPRIMIDO (viene incluida en ./wallet)
# =============================================
spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_ALIAS:bdadmin_high}
spring.datasource.username=${DB_USER:admin_hotel_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${TNS_ADMIN_PATH:./wallet}
spring.datasource.hikari.data-source-properties.oracle.net.wallet_location=(SOURCE=(METHOD=FILE)(METHOD_DATA=(DIRECTORY=${TNS_ADMIN_PATH:./wallet})))

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# =============================================
# THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =============================================
# SEGURIDAD
# =============================================
spring.security.user.name=admin_default
spring.security.user.password=disabled_use_db

# =============================================
# LOGGING
# =============================================
logging.level.com.hotel=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
