# =============================================
# CONFIGURACION DEL SERVIDOR
# =============================================
server.port=8080
spring.application.name=hotel-altavista-sistema

# Carga application-local.properties si existe (ese archivo esta en
# .gitignore, ahi va la clave real -- nunca se sube a GitHub)
spring.config.import=optional:application-local.properties

# =============================================
# CONEXION A ORACLE CLOUD ATP - WALLET
# Usuario de conexion de la app: admin_hotel_app
# (NO usar ADMIN para la app; ADMIN es solo para administracion)
#
# Las credenciales NO se escriben aqui: se leen de application-local.properties
# (archivo local, en .gitignore) o de variables de entorno.
# =============================================
spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_ALIAS:bdadmin_high}
spring.datasource.username=${DB_USER:admin_hotel_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${TNS_ADMIN_PATH:./wallet}
spring.datasource.hikari.data-source-properties.oracle.net.wallet_location=(SOURCE=(METHOD=FILE)(METHOD_DATA=(DIRECTORY=${TNS_ADMIN_PATH:./wallet})))

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# =============================================
# THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =============================================
# SEGURIDAD
# =============================================
spring.security.user.name=admin_default
spring.security.user.password=disabled_use_db

# =============================================
# LOGGING
# =============================================
logging.level.com.hotel=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG